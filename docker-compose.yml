services:

  runtime:
    build: .
    image: spark-runtime:latest
    platform: linux/arm64 
    profiles:
      - runtime
    environment:
      - SPARK_ROOT_PATH=${SPARK_ROOT_PATH:-/spark}
    ports:
      - "8000:8000"
    volumes:
      - ./runtime_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
